[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-resource-ownership-dashboard"
version = "0.1.0"
description = "Static HTML dashboard generator for OCI resource ownership and mandatory tag compliance."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1",
  "jinja2>=3.1",
  "oci>=2.125",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oci-resource-dashboard = "oci_resource_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
